[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-guider-backend"
version = "0.1.0"
description = "Minimum end-to-end FastAPI backend for a multimodal ecommerce shopping guide agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "sentence-transformers>=3.0,<4.0",
  "transformers>=4.40,<5.0",
  "torch>=2.2",
  "numpy>=1.26"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pytest>=8.0,<9.0",
  "sentence-transformers>=3.0,<4.0",
  "transformers>=4.40,<5.0",
  "torch>=2.2",
  "numpy>=1.26"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
